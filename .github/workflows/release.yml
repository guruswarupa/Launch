name: Release

on:
  push:
    branches: [master]
    paths:
      - app/build.gradle.kts
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to publish to
        type: choice
        default: production
        options:
          - production
          - beta
          - alpha
          - internal
          - none (GitHub release only)
      status:
        description: Release status on Google Play
        type: choice
        default: completed
        options:
          - completed
          - draft

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.should_release }}
      version_name: ${{ steps.diff.outputs.version_name }}
      version_code: ${{ steps.diff.outputs.version_code }}
      track: ${{ steps.diff.outputs.track }}
      status: ${{ steps.diff.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare versionName against previous commit
        id: diff
        env:
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          track="${INPUT_TRACK:-production}"
          status="${INPUT_STATUS:-completed}"
          case "$track" in
            none*) track="none" ;;
          esac
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Play track: $track ($status)"
          current_code=$(git rev-list --count HEAD)
          current_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version_code=$current_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$current_name" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered: releasing v$current_name ($current_code)"
            exit 0
          fi

          previous_name=$(git show HEAD^:app/build.gradle.kts 2>/dev/null | grep -oP 'versionName\s*=\s*"\K[^"]+' || echo "")
          if [ "$current_name" != "$previous_name" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "versionName $previous_name -> $current_name: releasing v$current_name ($current_code)"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "versionName unchanged ($current_name): skipping release"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}
      VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
      PLAY_TRACK: ${{ needs.check-version.outputs.track }}
      PLAY_STATUS: ${{ needs.check-version.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --console=plain

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "Release v${VERSION_NAME} already exists - re-uploading assets instead of failing"
            gh release upload "v${VERSION_NAME}" \
              app/build/outputs/bundle/release/app-release.aab \
              app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "v${VERSION_NAME}" \
              --title "Launch-v${VERSION_NAME}" \
              --generate-notes \
              --target "${{ github.sha }}" \
              app/build/outputs/bundle/release/app-release.aab \
              app/build/outputs/apk/release/app-release.apk
          fi

      - name: Publish to Play Store (${{ env.PLAY_TRACK }})
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.guruswarupa.launch
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
